[package]
name = "sales-form"
version = "0.1.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
calamine = "0.26"
umya-spreadsheet = "2"
imagesize = "0.14"
open = "5"
chrono = "0.4"

[profile.release]
strip = true
lto = true
